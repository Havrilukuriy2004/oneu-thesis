name: Validate thesis source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q .
  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R source without executing models
        run: Rscript -e 'for (f in list.files(pattern="[.]R$", recursive=TRUE)) parse(f, encoding="UTF-8")'
